<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 55 240 275" fill="none">
  <defs>
    <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d7b0"/>
      <stop offset="1" stop-color="#c99a62"/>
    </linearGradient>
    <linearGradient id="plySide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a32"/>
      <stop offset="1" stop-color="#b57a45"/>
    </linearGradient>
    <linearGradient id="baseTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd2a8"/>
      <stop offset="1" stop-color="#c08950"/>
    </linearGradient>
    <radialGradient id="ledR" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ff6a5a"/>
      <stop offset="1" stop-color="#9a0d0d"/>
    </radialGradient>
    <radialGradient id="ledY" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#b07a00"/>
    </radialGradient>
    <radialGradient id="ledG" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#5ee08a"/>
      <stop offset="1" stop-color="#0d6a32"/>
    </radialGradient>
    <pattern id="grain" width="18" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q4 1 9 3 T18 3" stroke="#8a5a32" stroke-opacity=".12" stroke-width=".7" fill="none"/>
    </pattern>
  </defs>
  <rect width="320" height="360" fill="#f3eee6"/>
  <ellipse cx="160" cy="318" rx="92" ry="10" fill="#000" opacity=".08"/>

  <!-- base -->
  <path d="M58 248 L160 218 L262 248 L262 286 L160 316 L58 286 Z" fill="url(#baseTop)"/>
  <path d="M58 248 L160 278 L262 248 L160 218 Z" fill="#f6dfb8"/>
  <path d="M58 248 L58 286 L160 316 L160 278 Z" fill="#b57a45"/>
  <path d="M262 248 L262 286 L160 316 L160 278 Z" fill="#8a5a32"/>
  <path d="M58 248 L160 218 L262 248 L160 278 Z" fill="url(#grain)"/>
  <path d="M86 256 L160 234 L234 256 L160 278 Z" fill="#3d2a1c" opacity=".18"/>

  <!-- tower body -->
  <path d="M128 86 L176 72 L192 78 L192 236 L144 252 L128 246 Z" fill="url(#ply)"/>
  <path d="M128 86 L144 96 L144 252 L128 246 Z" fill="url(#plySide)"/>
  <path d="M128 86 L176 72 L192 78 L144 96 Z" fill="#f7e2c0"/>
  <path d="M144 96 L192 78 L192 236 L144 252 Z" fill="url(#grain)"/>

  <!-- face plate -->
  <path d="M148 108 L180 98 L180 214 L148 224 Z" fill="#e8c48a" stroke="#6a4228" stroke-width="1.1"/>
  <circle cx="164" cy="126" r="16" fill="#2a1810"/>
  <circle cx="164" cy="156" r="16" fill="#2a1810"/>
  <circle cx="164" cy="186" r="16" fill="#2a1810"/>
  <circle cx="164" cy="126" r="11.5" fill="url(#ledR)"/>
  <circle cx="164" cy="156" r="11.5" fill="url(#ledY)"/>
  <circle cx="164" cy="186" r="11.5" fill="url(#ledG)"/>
  <circle cx="159" cy="122" r="3.2" fill="#fff" opacity=".35"/>
  <circle cx="159" cy="152" r="3.2" fill="#fff" opacity=".35"/>
  <circle cx="159" cy="182" r="3.2" fill="#fff" opacity=".35"/>

  <!-- 3 rocker switches on the base, one per lamp -->
  <g>
    <path d="M96 262 L118 254 L124 258 L124 270 L102 278 L96 274 Z" fill="#3a2a1c"/>
    <path d="M100 264 L118 257 L118 266 L100 273 Z" fill="#ff4d3d"/>
    <path d="M100 264 L118 257 L120 259 L102 266 Z" fill="#ff9a8a"/>
  </g>
  <g>
    <path d="M140 276 L162 268 L168 272 L168 284 L146 292 L140 288 Z" fill="#3a2a1c"/>
    <path d="M144 278 L162 271 L162 280 L144 287 Z" fill="#ffd24a"/>
    <path d="M144 278 L162 271 L164 273 L146 280 Z" fill="#ffe9a0"/>
  </g>
  <g>
    <path d="M184 262 L206 254 L212 258 L212 270 L190 278 L184 274 Z" fill="#3a2a1c"/>
    <path d="M188 264 L206 257 L206 266 L188 273 Z" fill="#2fce6a"/>
    <path d="M188 264 L206 257 L208 259 L190 266 Z" fill="#8aeead"/>
