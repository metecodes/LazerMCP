<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 22 230 310" fill="none">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d7b0"/>
      <stop offset="1" stop-color="#c99a62"/>
