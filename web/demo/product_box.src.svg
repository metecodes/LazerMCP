<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 48 280 220" fill="none">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c896"/>
      <stop offset="1" stop-color="#c08950"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b57a45"/>
      <stop offset="1" stop-color="#7a4a28"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d7b0"/>
      <stop offset="1" stop-color="#c99a62"/>
    </linearGradient>
    <pattern id="g2" width="22" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 Q5 1 11 4 T22 4" stroke="#7a4a28" stroke-opacity=".14" stroke-width=".8" fill="none"/>
    </pattern>
  </defs>
  <rect width="360" height="300" fill="#f3eee6"/>
  <ellipse cx="180" cy="248" rx="118" ry="12" fill="#000" opacity=".08"/>

  <!-- open isometric crate, looking into the mouth -->
  <path d="M64 118 L180 70 L296 118 L296 198 L180 248 L64 198 Z" fill="#c99a62"/>
  <path d="M64 118 L64 198 L180 248 L180 168 Z" fill="url(#wallL)"/>
  <path d="M296 118 L296 198 L180 248 L180 168 Z" fill="url(#wallR)"/>
  <path d="M64 118 L180 168 L296 118 L180 70 Z" fill="#efd2a8"/>
  <path d="M64 118 L180 70 L296 118 L180 168 Z" fill="url(#g2)"/>

  <!-- inner well / open mouth -->
  <path d="M96 132 L180 168 L264 132 L180 98 Z" fill="#2a1810"/>
  <path d="M108 136 L180 166 L252 136 L180 108 Z" fill="url(#floor)"/>
  <path d="M108 136 L180 166 L252 136 L180 108 Z" fill="url(#g2)"/>
  <path d="M108 136 L180 108 L180 166 L108 136 Z" fill="#000" opacity=".08"/>
  <path d="M252 136 L180 108 L180 166 L252 136 Z" fill="#000" opacity=".16"/>

  <!-- finger joints on the open rim -->
  <g stroke="#6a4228" stroke-width="2.2" stroke-linecap="square">
    <path d="M92 108 L100 104 M120 96 L128 93 M152 84 L160 81 M200 81 L208 84 M232 93 L240 96 M260 104 L268 108"/>
    <path d="M64 140 L76 146 M64 162 L76 168 M64 184 L76 190"/>
    <path d="M296 140 L284 146 M296 162 L284 168 M296 184 L284 190"/>
  </g>
  <!-- ply edge on rim -->
  <path d="M96 132 L180 98 L264 132" stroke="#f7e2c0" stroke-width="2.4" opacity=".7"/>
</svg>
